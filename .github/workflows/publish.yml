name: Publish to PyPI

on:
  push:
    tags:
      - 'v*' # Si attiva solo quando pushi un tag che inizia con 'v' (es. v0.0.3)

jobs:
  build-n-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    
    # Questi permessi sono FONDAMENTALI per l'autenticazione sicura OIDC con PyPI
    permissions:
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build binary wheel and source tarball
      run: python -m build

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypiserve@release/v1
      with:
        repository-environment: pypi
